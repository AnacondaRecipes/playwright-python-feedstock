{% set name = "playwright-python" %}
{% set version = "1.62.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/Microsoft/playwright-python/archive/v{{ version }}.tar.gz
  sha256: 30cc72a0c00a22c3d287539233d3d6abd579becbfe7d02aef80bd3e75c951455
  patches:
    - auditwheel.patch  # auditwheel is only available for linux, so we remove it from the build requirements
    - setup.patch       # Disable download of binaries
    - driver.patch      # Fix playwright nodejs location

build:
  number: 0
  entry_points:
    - playwright=playwright.__main__:main
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: True  # [py<310]

requirements:
  host:
    - python
    - wheel >=0.47.0
    - setuptools >=82.0.1
    - setuptools-scm >=10.2.1
    - pip
  run:
    - python
    - greenlet >=3.1.1,<4.0.0
    - pyee >=13,<14
    - playwright
    - typing-extensions >=4.16.0

test:
  imports:
    - playwright
    - playwright.sync_api
    - playwright.async_api
  commands:
    - pip check
    - playwright install --help
    - playwright --help
    # Unable to run pytests. The conftest.py import pixelmatch library which is not in main or snowflake channel.
  requires:
    - pip

about:
  home: https://playwright.dev/python/
  summary: Python version of the Playwright testing and automation library.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  description: |
    Playwright is a Python library to automate Chromium, Firefox and WebKit browsers with a single API. 
    Playwright delivers automation that is ever-green, capable, reliable and fast.
  dev_url: https://github.com/Microsoft/playwright-python
  doc_url: https://playwright.dev/python/docs/intro

extra:
  recipe-maintainers:
    - jan-janssen
